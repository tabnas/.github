# Target: tabnas/.github -> .github/workflows/scorecard.yml
#
# Reusable OpenSSF Scorecard analysis for tabnas repos.
# Measures security posture (branch protection, pinned actions, SECURITY.md,
# dangerous-workflow patterns, etc.) and publishes results to the public
# OpenSSF API so each repo can show a score badge.
#
# Callers hold the triggers + permissions (Scorecard needs branch_protection_rule
# and a weekly schedule); see the ci/scorecard.yml caller in each repo.
# Action refs use tags for readability; Renovate pins them to SHAs.

name: scorecard

on:
  workflow_call:
    inputs:
      publish_results:
        description: Publish results to the OpenSSF API (enables the badge).
        type: boolean
        default: true

# NO top-level permissions here, deliberately. GitHub's rule for a called
# workflow is that permissions "can only be maintained or reduced -- not
# elevated -- throughout the chain". A top-level `permissions: read-all`
# REDUCES the chain to read, and the analysis job below then asks for
# security-events: write, which is an elevation above what this file just
# gave away. GitHub rejects that before any job starts, which is why every
# caller in the fleet failed identically with startup_failure and an
# unhelpful "workflow file issue".
#
# The OpenSSF starter template carries `permissions: read-all` at the top and
# is correct STANDALONE, where top-level permissions are a default that a job
# may elevate above. Copying it verbatim into a reusable workflow is what
# broke it: the same three lines mean 'default' in one context and 'ceiling'
# in the other. The job keeps its own least-privilege block below; the caller
# grants exactly those three, so the chain is maintained, never elevated.

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish_results provenance
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: results.sarif
