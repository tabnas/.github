# Reusable: build and attach the per-format clib release artifacts.
# Lives in tabnas/.github/.github/workflows/clib-release.yml; called by
# each COMPONENT repo's .github/workflows/clib-release.yml (stamped by
# adopt-clib.sh).
#
# TWO LANES (ADR-12 clause 5; strategy note §8):
#   portable  Linux + zig cross-compiles linux/amd64, linux/arm64,
#             windows/amd64. GATES the artifact release.
#   darwin    macos-14, builds the host arch only (darwin/arm64).
#             Best-effort twice over: an org/repo variable switches the
#             lane off without editing workflows, and continue-on-error
#             means a red Mac never reds the release. darwin/amd64 is
#             not attempted here — attach it late from an Intel Mac or
#             via the clib-darwin-attach dispatch.
#
# The assemble job runs whenever portable succeeded — darwin missing,
# failed, or disabled — and writes manifest.json recording per-target
# presence, so absence is explicit data for every binding's loader
# (schema: parser/schema/clib-artifacts-manifest.schema.json).
name: clib-release

on:
  workflow_call:
    inputs:
      lib:
        description: "library base name, e.g. libtabnasjson"
        required: true
        type: string
      tag:
        description: "release tag to attach artifacts to"
        required: true
        type: string

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
      - name: install zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: build portable targets
        run: cd go/clib && ZIG=zig ./build.sh linux/amd64 linux/arm64 windows/amd64 windows/arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clib-portable
          path: go/clib/dist/*
          if-no-files-found: error

  darwin:
    runs-on: macos-14
    if: ${{ vars.TABNAS_DARWIN != 'off' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go/go.mod
      - name: build darwin host target
        run: cd go/clib && ./build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clib-darwin
          path: go/clib/dist/*
          if-no-files-found: error

  assemble:
    needs: [portable, darwin]
    if: ${{ always() && needs.portable.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: write manifest.json
        env:
          LIB: ${{ inputs.lib }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, glob
          lib, tag = os.environ["LIB"], os.environ["TAG"]
          targets = {  # target -> expected artifact filename
            "linux/amd64":   f"{lib}-linux-amd64.so",
            "linux/arm64":   f"{lib}-linux-arm64.so",
            "windows/amd64": f"{lib}-windows-amd64.dll",
            "windows/arm64": f"{lib}-windows-arm64.dll",
            "darwin/arm64":  f"{lib}-darwin-arm64.dylib",
            "darwin/amd64":  f"{lib}-darwin-amd64.dylib",
          }
          have = {os.path.basename(p): p for p in glob.glob("dist/*")}
          out = {"schema": 1, "lib": lib, "tag": tag, "targets": {}}
          for t, fname in targets.items():
              if fname in have:
                  sha = hashlib.sha256(open(have[fname], "rb").read()).hexdigest()
                  out["targets"][t] = {"file": fname, "sha256": sha, "present": True}
              else:
                  out["targets"][t] = {"file": fname, "present": False}
          json.dump(out, open("dist/manifest.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
      - name: attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # Upload exactly what manifest.json lists, and nothing else. dist/
          # also holds c-shared headers (build byproducts; the canonical
          # header ships in the repo) and build.sh's unsuffixed lib<name>.so
          # and .dylib convenience symlinks, which upload-artifact turns into
          # full copies. Globbing dist/* published those as assets no
          # manifest names: a second, unlabelled copy of one architecture,
          # the ambiguity clib-darwin-attach already refuses to create.
          python3 - <<'PY' > upload.txt
          import json
          m = json.load(open("dist/manifest.json"))
          print("dist/manifest.json")
          for t in m["targets"].values():
              if t["present"]:
                  print("dist/" + t["file"])
          PY
          cat upload.txt
          xargs gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" < upload.txt
