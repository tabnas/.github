# Target: tabnas/.github -> .github/workflows/polyglot-ci.yml
#
# Reusable CI for tabnas polyglot repos (ts/ + go/).
#
# Callers pass the tabnas sibling repos they depend on; this workflow clones
# them side by side (the layout local development uses), builds everything in
# order, and tests this repo's ts/ and go/ trees.
#
# Caller example (.github/workflows/ci.yml in each repo):
#
#   name: ci
#   on:
#     push:        { branches: [ main ] }
#     pull_request: { branches: [ main ] }
#   jobs:
#     ci:
#       uses: tabnas/.github/.github/workflows/polyglot-ci.yml@main
#       with:
#         deps: "parser debug json abnf railroad"
#
# `parser` itself inverts the order (it smoke-tests its dependents), so it
# passes build-order explicitly:
#
#       with:
#         deps: "debug json abnf railroad"
#         build-order: "parser debug json abnf railroad"
#
# Action refs use version tags for readability; Renovate
# (helpers:pinGitHubActionDigests) pins them to commit SHAs automatically.

name: polyglot-ci

on:
  workflow_call:
    inputs:
      deps:
        description: >-
          Space-separated tabnas sibling repos to clone, in topological
          (dependency-first) order. Empty for repos with no tabnas deps.
        type: string
        default: ""
      build-order:
        description: >-
          Space-separated build order for the ts stack, including this repo.
          Defaults to "<deps> <this repo>".
        type: string
        default: ""
      run-ts:
        description: Build and test the ts/ tree.
        type: boolean
        default: true
      run-go:
        description: Build and test the go/ tree.
        type: boolean
        default: true
      node-version:
        type: string
        default: "24.x"
      go-version:
        type: string
        default: "1.24"

jobs:
  ts:
    if: ${{ inputs.run-ts }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Use LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: ${{ github.event.repository.name }}
      - name: Use Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Clone tabnas dependencies
        shell: bash
        run: |
          set -e
          for dep in ${{ inputs.deps }}; do
            git clone --depth 1 "https://github.com/tabnas/$dep.git" "$dep"
          done
      - name: Build (dependencies, then this repo)
        shell: bash
        run: |
          set -e
          ORDER="${{ inputs.build-order }}"
          [ -n "$ORDER" ] || ORDER="${{ inputs.deps }} ${{ github.event.repository.name }}"
          ROOT="$PWD"

          # Point each @tabnas/* dependency at the sibling checkout cloned in
          # the previous step, replacing the published copy `npm i` installs.
          #
          # Without this the clones are dead work. Every package declares its
          # siblings as "*", so npm resolves them from the registry and the
          # source we just built is never loaded — meaning no cross-repo
          # change can be validated before it is released. It is invisible in
          # the log too: a repo's version is not bumped until release, so the
          # registry copy and the source copy report the SAME version while
          # differing in code.
          #
          # The go job below already does the equivalent, via `go work use`
          # over the cloned modules. This is the missing TypeScript half.
          link_siblings() {
            pkgdir="$1"
            for dep in ${{ inputs.deps }}; do
              [ -f "$ROOT/$dep/ts/package.json" ] || continue
              # Never link a package into its own node_modules. A dep also
              # appears in ORDER, so without this parser links parser and the
              # copy fallback dies with "cannot copy a directory into itself"
              # (on unix ln -s quietly made a self-referential link instead).
              [ "$ROOT/$dep/ts" = "$pkgdir" ] && continue
              # Read the name with a RELATIVE require: on the windows runner
              # $ROOT is an MSYS path (/d/a/repo/repo) which node cannot
              # resolve, and an absolute path here fails with
              # "Cannot find module".
              name=$(cd "$ROOT/$dep/ts" && node -p "require('./package.json').name")
              [ -n "$name" ] || continue
              target="$pkgdir/node_modules/$name"
              # Only substitute what npm actually installed; do not invent
              # dependencies a package never declared.
              { [ -e "$target" ] || [ -L "$target" ]; } || continue
              rm -rf "$target"
              mkdir -p "$(dirname "$target")"
              # Symlink where the platform allows it. On windows, unprivileged
              # symlink creation may fail or produce something node will not
              # follow, so fall back to a copy — the dependency has already
              # been built by this point in ORDER, so the copy carries dist/.
              if ! ln -s "$ROOT/$dep/ts" "$target" 2>/dev/null \
                 || [ ! -f "$target/package.json" ]; then
                rm -rf "$target"
                cp -R "$ROOT/$dep/ts" "$target"
                echo "copied $name <- $dep/ts (symlink unavailable)"
              else
                echo "linked $name -> $dep/ts (was the published copy)"
              fi
            done
          }

          for pkg in $ORDER; do
            ( cd "$pkg/ts" && npm i )
            # Link BEFORE building, so each package compiles against sibling
            # source rather than the registry.
            link_siblings "$ROOT/$pkg/ts"
            ( cd "$pkg/ts" && npm run build --if-present )
          done
      - name: Test
        shell: bash
        working-directory: ${{ github.event.repository.name }}/ts
        run: npm test

  go:
    if: ${{ inputs.run-go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: ${{ github.event.repository.name }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ inputs.go-version }}
      - name: Clone tabnas dependencies
        shell: bash
        run: |
          set -e
          for dep in ${{ inputs.deps }}; do
            git clone --depth 1 "https://github.com/tabnas/$dep.git" "$dep"
          done
      # Mirror admin/scripts/link.sh: vendor symlinks for ../vendor/ replaces,
      # then a go.work over every module EXCEPT those vendor-replaced ones.
      - name: Set up go workspace
        shell: bash
        run: |
          set -e
          for gm in $(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*'); do
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              v=$(printf '%s' "$line" | sed -E 's#.*\.\./vendor/([^/]+)/go.*#\1#')
              dep=$(printf '%s' "$line" | awk '{print $2}' | sed -E 's#github.com/tabnas/([^/]+)/go#\1#')
              repodir=$(dirname "$(dirname "$gm")")
              mkdir -p "$repodir/vendor"
              ln -snf "$(cd "$dep" && pwd)" "$repodir/vendor/$v"
            done < <(grep -E '^[[:space:]]*replace .*=>[[:space:]]*\.\./vendor/' "$gm" || true)
          done
          go work init
          for gm in $(find . -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*'); do
            grep -qE '^[[:space:]]*replace .*=>[[:space:]]*\.\./vendor/' "$gm" && continue
            go work use "$(dirname "$gm")"
          done
      - name: Build
        working-directory: ${{ github.event.repository.name }}/go
        run: go build ./...
      # The workspace above makes go.mod's declared versions invisible: every
      # github.com/tabnas/* require resolves to the sibling clone, so a stale or
      # wrong pin is never exercised and CI structurally cannot see it. That hid
      # three stale pins at two depths, and one (ebnf) had already shipped
      # broken to main before anyone noticed. GOWORK=off resolves from go.mod
      # against the module proxy instead, which is what a consumer of the
      # published module actually gets.
      #
      # Read the error before acting on it — an unpublished pin and a wrong pin
      # both land here, and either can surface as "unknown revision go/vX.Y.Z"
      # or as "missing go.sum entry" depending on what go.sum already holds:
      #   the version is simply not published yet — normal mid-release-wave,
      #       and the honest reading of a red main straight after a merge that
      #       adds engine API. Publish the dependency, then re-run.
      #   the version is published but wrong, or the code no longer compiles
      #       against it — the defect this step exists to catch. Fix go.mod;
      #       do not paper over it by leaning on the workspace.
      - name: Build from go.mod (GOWORK=off — the workspace hides stale pins)
        shell: bash
        working-directory: ${{ github.event.repository.name }}
        env:
          GOWORK: "off"
        run: |
          set -e
          for gm in $(find go -name go.mod -not -path '*/vendor/*' | sort); do
            d="$(dirname "$gm")"

            # GOWORK=off turns the workspace off; it does NOT turn a module's
            # own `replace` off. A committed filesystem replace — the
            # `=> ../vendor/<dep>` form the workspace step above symlinks to a
            # sibling clone — would therefore route this build straight back to
            # that clone, and the step would pass while the declared version
            # went untested. No repo in the fleet carries one today. If one
            # appears, fail loudly rather than let a gate quietly stop seeing
            # what it says it sees.
            #
            # A version-to-version replace is fine and is not flagged: it still
            # resolves through the proxy, so the declared graph is exercised.
            if go -C "$d" mod edit -json \
                 | jq -e '[(.Replace // [])[] | select(.New.Path | test("^[./]"))] | length > 0' \
                 >/dev/null; then
              echo "::error file=$gm::filesystem replace directive present -" \
                   "GOWORK=off resolves through it, so this step cannot validate" \
                   "the declared versions of this module. Extend the step before" \
                   "committing a local replace."
              exit 1
            fi

            echo "==> $d: build"
            ( cd "$d" && go build ./... )

            # go build never compiles _test.go, so a dependency reachable only
            # from tests stays unresolved here and is then satisfied by the
            # workspace in the Test step below — the same blind spot one level
            # down. -run '^$' builds every test binary and runs no test.
            echo "==> $d: compile tests"
            ( cd "$d" && go test -count=1 -run '^$' ./... )
          done
      - name: Test
        working-directory: ${{ github.event.repository.name }}/go
        run: go test -v ./...
